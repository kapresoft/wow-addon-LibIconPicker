# This is used for development to pull external libraries.
# @see also: ./dev/pull-extlib.sh
# --------------------------
# cmd: ./dev/release.sh -duz -r ./.release -m _setup.yml
# Note: This will build in ./.release/_setup directory
package-as: _setup
# --------------------------
# Reuses dev/changelog-release.md. release-build.yml overwrites it at
# release time for the packager to read, but never commits that change back,
# so the tracked copy here always stays blank.
manual-changelog:
  filename: dev/changelog-release.md
  markup-type: markdown

# Use github because svn repos are slower
# basepath is ${package-as}
externals:
  ThirdParty-Libs/LibStub: https://github.com/lua-wow/LibStub
  ThirdParty-Libs/Ace3: https://github.com/WoWUIDev/Ace3

ignore:
  - "*.md"
  - "*.yaml"
  - "*.toc"
  - dev
  - doc
  - LICENSE
  - LibIconPicker
  - ThirdParty-Libs/Ace3/Bindings.xml
  - ThirdParty-Libs/Ace3/LibStub
  - ThirdParty-Libs/Ace3/AceAddon-3.0
  - ThirdParty-Libs/Ace3/AceBucket-3.0
  - ThirdParty-Libs/Ace3/AceComm-3.0
  - ThirdParty-Libs/Ace3/AceConfig-3.0
  - ThirdParty-Libs/Ace3/AceConsole-3.0
  - ThirdParty-Libs/Ace3/AceDB-3.0
  - ThirdParty-Libs/Ace3/AceDBOptions-3.0
  - ThirdParty-Libs/Ace3/AceEvent-3.0
  - ThirdParty-Libs/Ace3/AceGUI-3.0
  - ThirdParty-Libs/Ace3/AceHook-3.0
  - ThirdParty-Libs/Ace3/AceSerializer-3.0
  - ThirdParty-Libs/Ace3/AceTab-3.0
  - ThirdParty-Libs/Ace3/AceTimer-3.0
  - ThirdParty-Libs/Ace3/CallbackHandler-1.0
  - ThirdParty/Ace3.xml
  - ThirdParty/ThirdParty.xml
  - Libs
  - LibIconPicker.xml
  - LICENSE.txt

# Base path is .release/
move-folders:
  _setup/ThirdParty-Libs: ../ThirdParty/Libs
