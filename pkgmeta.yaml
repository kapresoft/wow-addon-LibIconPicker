package-as: LibIconPicker
# --------------------------
manual-changelog: false
license-output: LICENSE.txt
enable-nolib-creation: no

embedded-libraries:
  - LibStub
  - Ace3
  - LibSharedMedia-3-0

tools-used:
  - DevSuite
  - DebugChatFrame
  - Addon-Usage
  - Bugsack
  - Bug-Grabber

# Resources:
# Ace3: https://www.wowace.com/projects/ace3
# LibSharedMedia: https://www.wowace.com/projects/libsharedmedia-3-0

externals:
  ThirdParty/Libs/LibStub: https://github.com/lua-wow/LibStub
  ThirdParty/Libs/Ace3: https://repos.wowace.com/wow/ace3/trunk
  ThirdParty/Libs/LibSharedMedia/LibSharedMedia-3.0: https://repos.wowace.com/wow/libsharedmedia-3-0/trunk/LibSharedMedia-3.0

ignore:
  - "*.sh"
  - "*.md"
  - "*.yaml"
  - "*.yml"
  - dev
  - doc
  - ThirdParty/Libs/Ace3/Ace3.lua
  - ThirdParty/Libs/Ace3/tests
  - ThirdParty/Libs/Ace3/Bindings.xml

# REQUIRED for CurseForge packager (non-obvious):
# The LEFT side MUST be <repo-folder>/<addon-folder>
#   - <addon-folder> MUST be the folder that contains the .toc files
# The RIGHT side MUST be the addon name:
#   - Must match the .toc filename (AddonName.toc)
#   - Must match `package-as`
#
# NOTE:
# CurseForge release.sh (poorly) relies on `move-folders` for *addon discovery*,
# not just post-processing. If this does not exactly match
# <repo>/<addon>, `toc_root_paths` will be empty and packaging WILL fail.
#
# ⚠️ Do not change unless you also change the repo/addon layout.
#move-folders:
#  LibIconPicker/LibIconPicker: LibIconPicker
